# Publication STAGÉE sur npm au push d'un tag `vX.Y.Z` (ou à la main via
# l'onglet Actions), par TRUSTED PUBLISHING (OIDC) : AUCUN token npm stocké —
# rien à voler — et la CI ne peut QUE stager, jamais publier directement.
# Prérequis UNIQUE, une fois : sur npmjs.com, page du paquet ltn-print-labels
# → Settings → Trusted Publisher → GitHub Actions, avec repository
# `rondeaujf/ltn-print-labels`, workflow `npm-publish.yml`, environment vide,
# permission `npm stage publish` (le défaut depuis septembre 2026 — ne PAS
# cocher le publish direct : le verrou humain ci-dessous en dépend).
#
# Durcissements délibérés :
#  - actions épinglées par SHA de commit (un tag v4 peut être déplacé) ;
#  - tests/lint/format joués en étapes séparées puis `npm stage publish
#    --ignore-scripts` : aucun code de dépendance ne s'exécute pendant l'étape
#    qui détient le droit de stager ;
#  - `permissions` minimal, `id-token: write` ne sert qu'à l'OIDC/provenance ;
#  - publication STAGÉE : même une CI compromise ne peut pas mettre une
#    version en ligne — l'approbation 2FA du mainteneur reste obligatoire.
#
# Flux de release :
#   1. bump `version` dans package.json + entrée CHANGELOG, merge sur main ;
#   2. `git tag v0.1.12 && git push origin v0.1.12` — le workflow refuse un
#      tag qui ne correspond pas à la version du package.json ;
#   3. la version arrive en STAGING : l'approuver (2FA) sur npmjs.com, onglet
#      Versions du paquet, une fois le scan anti-malware terminé — c'est là
#      qu'elle devient publique.
name: Publier sur npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC Trusted Publishing + attestation de provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # PAS de `registry-url` ici : setup-node écrirait alors un .npmrc avec un
      # `_authToken` placeholder (XXXXX-…) que npm utiliserait AU LIEU de
      # tenter l'échange OIDC → 404 du registre. Sans config d'auth, npm vise
      # registry.npmjs.org par défaut et bascule de lui-même sur le Trusted
      # Publishing quand il tourne dans GitHub Actions.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Le Trusted Publishing exige npm ≥ 11.5.1 et `npm stage publish`
      # npm ≥ 11.15 (Node 22 embarque npm 10).
      - run: npm install -g npm@latest

      # Un tag v0.1.11 qui publierait le package.json en 0.1.10 = erreur
      # d'étourderie classique ; on refuse avant de toucher au registre.
      - name: Le tag doit égaler la version du package
        if: github.ref_type == 'tag'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ≠ package.json $pkg"
            exit 1
          fi

      - run: npm ci

      # Les garde-fous de prepublishOnly, joués explicitement ici : la
      # publication elle-même passera --ignore-scripts.
      - run: npm test
      - run: npm run lint
      - run: npm run format:check

      # STAGE, pas publish : la permission OIDC du Trusted Publisher est
      # stage-only, la mise en ligne passe par l'approbation 2FA du mainteneur
      # sur npmjs.com. --ignore-scripts : l'étape qui détient le droit de
      # stager n'exécute AUCUN script de cycle de vie (les vérifications
      # viennent d'être jouées ci-dessus). Provenance générée d'office.
      - run: npm stage publish --ignore-scripts
